<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autopilot — confronto design</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9ece7; color: #18382a; font: 14px/1.4 system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 24px; padding: 14px 24px; border-bottom: 1px solid #cbd3cc; background: rgba(248,247,241,.96); }
      h1 { margin: 0; font: 400 24px Georgia, serif; }
      p { margin: 3px 0 0; color: #65736b; font-size: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; padding: 18px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #c7d0c8; border-radius: 14px; background: #fff; box-shadow: 0 12px 30px rgba(24,56,42,.08); }
      figcaption { padding: 10px 13px; border-bottom: 1px solid #dfe5df; color: #315844; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; aspect-ratio: 1269 / 720; object-fit: cover; object-position: top; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } header { position: static; } }
    </style>
  </head>
  <body>
    <header><div><h1>Design QA — Strategia Autopilot</h1><p>Stesso linguaggio visivo: avorio, verde foresta, font editoriale e grafici leggibili.</p></div><p>25 agosto 2026</p></header>
    <main>
      <figure><figcaption>Riferimento selezionato · onboarding review</figcaption><img src="./implementation-desktop-1487x1058.png" alt="Riferimento visuale selezionato" /></figure>
      <figure><figcaption>Implementazione · strategia applicata</figcaption><img src="./active-strategy-viewport-stable.png" alt="Nuova dashboard della strategia applicata" /></figure>
    </main>
  </body>
</html>
